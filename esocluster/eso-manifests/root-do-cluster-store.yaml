apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: root-do-cluster-store
spec:
  provider:
    vault:
      server: "https://:8200"
      path: "secret"
      version: "v1"
      caProvider:
        type: "Secret"
        name: "cabdlsec"
        key: "ca.crt"
        namespace: "default"
      auth:
        tokenSecretRef:
          name: "root-do-vault-token"
          key: "token"
          namespace: "default"